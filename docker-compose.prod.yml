# Phase 11 — DEPLOYMENT.md. The LINUX-HOST HALF of the two-host topology
# (Phase 0 §25): NestJS, PostgreSQL, Redis, and the web dashboard, all here,
# behind Caddy as the TLS-terminating reverse proxy. The Windows VPS running
# MT5 + the Python collector is deliberately NOT a service in this file — it
# runs outside Docker, on its own host, and only ever pushes outbound HTTPS
# to whatever domain Caddy serves `api` on (see collector/.env's
# COLLECTOR_API_BASE_URL). No inbound port is ever opened toward it.
#
# Usage: cp backend/.env.production.example backend/.env.production (fill
# in real secrets), same for frontend/, then:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Explicit project name — same root-cause fix as backend/docker-compose.yml
# (dev), applied here too. Compose derives project identity from the
# CURRENT DIRECTORY'S BASENAME by default, not the full path — on a VPS
# that also hosts v1 (whose own prod compose project is literally named
# "trading-monitor", derived the same default way from its own directory),
# an accidental basename collision would make `docker compose up` here
# silently adopt and "recreate" v1's real, live containers. This makes v2's
# project identity unambiguous no matter what directory it's deployed from.
name: trading-monitor-m1m5-v2-prod

services:
  postgres:
    image: postgres:16-alpine
    # Explicit and distinct from the dev compose's "m1m5-v2-postgres"
    # (backend/docker-compose.yml) — backup.sh/restore.sh's POSTGRES_CONTAINER
    # override already existed as a mechanism; the container just had nothing
    # predictable to point it at. This name is what .env.production's
    # POSTGRES_CONTAINER should reference. Also distinct from v1's own prod
    # container name — this project must never share a container name (or a
    # database) with v1, even if it's ever deployed to the same VPS.
    container_name: m1m5-v2-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - m1m5_v2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence, same reasoning as dev (backend/docker-compose.yml) —
    # plus a password, since this instance is reachable from other
    # containers on a network that (unlike dev) isn't purely local-machine.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - m1m5_v2_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # One-shot: applies pending Prisma migrations, then exits. `api` waits for
  # this to exit 0 before starting — never runs migrations from its own
  # boot path, so a rolling restart of `api` never re-runs `migrate deploy`.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: build
    env_file: ./backend/.env.production
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env.production
    # Loopback-only (single-VPS topology, DEPLOYMENT_SINGLE_VPS.md): the
    # Wine-hosted collector runs on this same host, outside Docker, and
    # needs to reach the API without round-tripping through the public
    # domain/Caddy. Bound to 127.0.0.1 specifically — never 0.0.0.0 — so
    # nothing outside this machine can reach port 3000 directly; the public
    # path through Caddy (443) is unaffected and still the only externally
    # reachable route to this service.
    #
    # Host port is ${API_HOST_PORT} (default 3010), NOT 3000 — on a VPS
    # that also runs v1 (whose own api container already binds host
    # 127.0.0.1:3000), reusing 3000 here would collide. Set API_HOST_PORT
    # explicitly in .env.production on any host where 3010 is also taken.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3010}:3000"
    # Gold's file-based runtime state (kill switch, stop-new-entries,
    # runtime settings, AI summaries) defaults to paths under process.cwd()
    # (/app inside this container, per the *_PATH env vars' own defaults —
    # see gold-kill-switch.ts etc.) — without a volume, any of that state
    # (most importantly the kill switch) would silently reset on every
    # `docker compose up --build`/container recreation. Mounted here so a
    # redeploy never silently re-arms new entries by discarding an engaged
    # kill switch.
    volumes:
      # The enabled strategy's runtime state, shared with m1m5-scheduler at the
      # SAME mount path. The api container is what writes the kill switch, the
      # stop-new-entries file and the recorded volume when an operator uses the
      # dashboard, so without this mount those writes would land in this
      # container's own /app and the scheduler would never see them -- the kill
      # switch would appear to do nothing, which is the worst possible way for
      # a safety control to fail.
      #
      # The retired strategies' runtime volumes are not mounted: their entry
      # wiring is disabled in code here, so they have no runtime state to keep.
      - m1m5_v2_runtime_data:/app/xauusd-m1m5-runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Dashboard authentication (Option B) put a bearer-token guard in front
    # of the rich /health endpoint, which this container obviously can't
    # carry — so it polls /health/live instead: a deliberately separate,
    # deliberately unauthenticated, deliberately minimal endpoint
    # (health.controller.ts) that answers only 200/503 with no per-component
    # detail. The 503 logic (fail on DATABASE/REDIS specifically — api's own
    # direct infrastructure, not external systems a restart can't fix
    # anyway) now lives server-side in that endpoint, not duplicated here.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # `m1m5-v2-api` is the name every V2 caller uses. NOT the bare service
    # name `api`: that is ambiguous for any container on more than one
    # network. When `web` joined `proxy_shared` to be served at
    # v2.jokertrade.tech, `api` there also resolved to ANOTHER bot's API
    # container, and the dashboard sent V2's token to it -- rejected (401),
    # with no V2 routes (404), but cross-talk the isolation exists to
    # prevent. A project-unique alias cannot collide with anything.
    networks:
      internal:
        aliases: [m1m5-v2-api]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./frontend/.env.production
    environment:
      # Overrides the env file on purpose. This container is on TWO networks,
      # and `api` resolves to another bot's API on the shared one; only the
      # project-unique alias is safe. Set here, in tracked config, so it cannot
      # be lost or mistyped in a gitignored file.
      BACKEND_API_URL: http://m1m5-v2-api:3000
    depends_on:
      api:
        # Genuinely useful here (not just added for symmetry): the
        # dashboard's own pages call the API server-side on nearly every
        # request, so waiting for api's healthcheck avoids a startup window
        # where web is "up" but every page it serves errors immediately.
        condition: service_healthy
    # Only checks that the Next.js server itself answers a request at all
    # (a hung event loop won't) — deliberately does NOT check whether the
    # page it serves can reach the API, which would just duplicate api's
    # own healthcheck and couple the two containers' health together.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Loopback-only host port, kept for an SSH tunnel if the domain is ever
    # unreachable. The public route is v2.jokertrade.tech, below.
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3011}:3001"
    # `proxy_shared` is how the host's ONE Caddy (it belongs to the legacy
    # trading-monitor project and owns ports 80/443) reaches each bot's
    # dashboard: every bot's web container joins it, and Caddy proxies to it
    # by name with basic auth in front. v2.jokertrade.tech -> m1m5-v2-web:3001.
    #
    # ONLY this container joins it. The api, scheduler, collector, database
    # and MT5 terminal stay on `internal`, unreachable from the shared
    # network. The alias is this project's own, so it cannot collide with
    # another bot's container name on that network, and does not depend on
    # the name Compose happens to generate.
    networks:
      internal: {}
      proxy_shared:
        aliases: [m1m5-v2-web]

  # ===========================================================================
  # The inherited `mt5-collector` service is deliberately NOT defined here.
  #
  # It belongs to the deployment this project was copied from, and it
  # bind-mounts THAT deployment's Wine prefix (/home/deploy/.mt5-v2) holding
  # THAT deployment's MT5 terminal and account. Leaving it in this stack would
  # have started a second collector against another bot's terminal the first
  # time this project was deployed -- the precise failure every isolation rule
  # in this repository exists to prevent.
  #
  # This project's equivalent is `m1m5-mt5-collector` below, with its own
  # image, its own prefix, its own terminal and its own account.
  # ===========================================================================


  # ===========================================================================
  # xauusd-m1-m5-rsi-threshold-v2 MT5 runtime: Wine + a dedicated prefix + this
  # project's OWN MetaTrader 5 terminal + the v2 collector, in one container.
  #
  # The collector lives in the SAME container as the terminal deliberately, not
  # for convenience: the MetaTrader5 Python package talks to terminal64.exe
  # over a fixed local IPC port that is per-host, not per-prefix. Splitting
  # them would put that IPC across a network boundary the package does not
  # support, and co-locating them is what makes the container's own network
  # namespace the isolation boundary. See the Dockerfile header.
  #
  # NO HOST PORTS. Nothing here needs to be reachable from the VPS host, so
  # nothing is published, and no port collision with any other bot is possible.
  # It reaches the backend over this Compose project's internal network by
  # service name.
  #
  # `user:` must match the uid/gid owning the bind-mounted Wine prefix on the
  # host, or Wine refuses to touch it.
  # ===========================================================================
  m1m5-mt5-collector:
    build:
      context: .
      dockerfile: deploy/docker/m1m5-mt5-collector/Dockerfile
    container_name: m1m5-v2-mt5-collector
    restart: unless-stopped
    user: "${M1M5_MT5_UID:-1000}:${M1M5_MT5_GID:-1000}"
    env_file: ./collector/.env.production
    environment:
      # Fail closed rather than auto-discovering a terminal. Set here, not only
      # in the env file, so it cannot be lost by editing that file.
      MT5_REQUIRE_EXPLICIT_TERMINAL: "true"
      # The project-unique API alias, not the bare `api`. The collector is on
      # one network today, so `api` is unambiguous for it now -- but the day
      # it joins a second, `api` could resolve to another bot's API, which
      # would then receive this collector's orders and credentials.
      COLLECTOR_API_BASE_URL: http://m1m5-v2-api:3000
    volumes:
      # This project's OWN prefix directory. Distinct from every other bot's:
      # the sibling deployment uses /home/deploy/.mt5-v2, and pointing both at
      # one directory would have two terminals sharing one installation.
      - ${M1M5_WINEPREFIX_PATH:-/home/deploy/.mt5-m1m5-v2}:/wineprefix
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ===========================================================================
  # The retired strategies' schedulers are deliberately NOT defined here.
  #
  # gold-scheduler, trend-breakout-scheduler and xauusd-rsi-scheduler exist in
  # the deployment this project was copied from. They are absent here because
  # this application has exactly one enabled strategy, and their entry wiring
  # is disabled in code in this copy anyway (see
  # backend/src/xauusd-m1m5/legacy-entries-disabled.ts), so running them would
  # burn CPU and muddy the logs while being structurally unable to trade.
  #
  # Their code, routes, tables and history remain intact and readable; only
  # their scheduler processes are not started.
  # ===========================================================================

  # The M1/M5 observation loop -- the piece that actually evaluates signals.
  # Without it the rest of the stack is plumbing with nothing deciding to
  # trade, and the api would come up looking healthy while nothing happens.
  #
  # Reuses the SAME image as `api`, overriding only the command, so the
  # scheduler and the API can never be running different builds of the same
  # code.
  #
  # Runs at the specified one-second cadence, so it is a long-lived process
  # rather than a cron. Its volume holds the kill switch, the stop-new-entries
  # file, the persisted per-timeframe indicator state and the recorded volume
  # setting. That persistence matters operationally: a restart that keeps the
  # volume resumes warm, while losing it forces a fresh 250-bar warm-up per
  # timeframe before any signal can fire.
  m1m5-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: m1m5-v2-scheduler
    restart: unless-stopped
    env_file: ./backend/.env.production
    command: ["node", "dist/scripts/xauusd-m1m5-scheduler.js"]
    volumes:
      - m1m5_v2_runtime_data:/app/xauusd-m1m5-runtime
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"


  # ===========================================================================
  # ENGINE B - the Telegram copy engine's ingestion process.
  #
  # Its own container, holding the Telegram USER session, for two reasons:
  #
  #   1. A credential of that weight should be reachable by one process, not
  #      by every container that imports the module. Only this service mounts
  #      the runtime volume for the purpose of reading it.
  #   2. Engine A must be unaffected by Engine B's liveness. If ingestion
  #      crashes, loses its Telegram connection or is deliberately stopped,
  #      the scheduler and collector keep observing RSI and managing Engine
  #      A's positions - they are different containers with different restart
  #      lifecycles.
  #
  # Reuses the SAME image as `api` and the scheduler, overriding only the
  # command, so ingestion and the API can never be running different builds.
  #
  # NO HOST PORTS: nothing needs to reach it.
  # ===========================================================================
  telegram-ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: m1m5-v2-telegram-ingest
    restart: unless-stopped
    env_file: ./backend/.env.production
    command: ["node", "dist/scripts/telegram-ingest.js"]
    volumes:
      # The same runtime volume the api and scheduler mount at the same path.
      # The Telegram session lives here, which is what makes it survive
      # container recreation, image rebuilds and a VPS reboot. It is never
      # baked into the image and never committed.
      - m1m5_v2_runtime_data:/app/xauusd-m1m5-runtime
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"


  # NOTE (topology alongside the other deployments on this host)
  #
  # No `caddy` service is defined here, on purpose: the legacy deployment's
  # Caddy already owns host ports 80 and 443, and a second container binding
  # them would simply fail to start.
  #
  # `api` and `web` are ALSO deliberately not attached to the external
  # `proxy_shared` network yet. This project has no public domain, so nothing
  # needs to reach it from outside the host, and declaring an external network
  # would make `docker compose up` fail outright if that network happened not
  # to exist. Both publish loopback-only host ports instead, reachable over an
  # SSH tunnel:
  #
  #     ssh -L 3020:127.0.0.1:3020 -L 3021:127.0.0.1:3021 <host>
  #
  # TO PUBLISH A DASHBOARD LATER, without touching another deployment's
  # compose file or containers:
  #   1. docker network create proxy_shared        (if it does not exist)
  #   2. docker network connect proxy_shared trading-monitor-caddy-1
  #   3. add `proxy_shared` back to api/web here, and re-add it under
  #      `networks:` as `external: true`
  #   4. add a site block to the EXISTING Caddy's own Caddyfile, reverse
  #      proxying to this project's api/web BY CONTAINER NAME over
  #      proxy_shared
  # Step 4 edits that deployment's configuration, so it needs its own
  # deliberate decision rather than being bundled into this project's deploy.

networks:
  internal:
  # Created and owned outside this project (the legacy deployment's Caddy is
  # on it). External, so `m1m5.sh stop` / `down` can never remove it and take
  # the other bots' public sites with it.
  proxy_shared:
    external: true

volumes:
  m1m5_v2_pgdata:
  m1m5_v2_redisdata:

  # Kill switch, stop-new-entries, persisted per-timeframe indicator and
  # crossing state, and the recorded volume setting. Keep this volume across
  # deployments: losing it costs a full 250-bar warm-up on each timeframe.
  m1m5_v2_runtime_data:
