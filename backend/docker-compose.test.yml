# See docker-compose.yml's own comment on this field — same fix, same reason.
# This matters even more here: `npm test` runs `test:db:up`, and
# `npm run test:db:down` runs `docker compose down -v`. Under the compose
# identity this project was copied with, that `down -v` would have destroyed
# the source project's live test containers and their volumes.
name: trading-monitor-m1m5-v2

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: m1m5-v2-postgres-test
    environment:
      POSTGRES_USER: m1m5_v2
      POSTGRES_PASSWORD: m1m5_v2_test_password
      POSTGRES_DB: m1m5_v2_test
    ports:
      - "5454:5432"
    tmpfs:
      # RAM-backed, no named volume — genuinely disposable.
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m1m5_v2"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis-test:
    image: redis:7-alpine
    container_name: m1m5-v2-redis-test
    ports:
      - "6491:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
